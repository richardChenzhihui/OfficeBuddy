<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="OfficeBuddy — edit Word and Excel by talking, verified by Word and Excel themselves" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="55%" stop-color="#141C36"/>
      <stop offset="100%" stop-color="#1F1236"/>
    </linearGradient>
    <radialGradient id="h-glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="40%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="h-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="h-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="h-card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#h-bg)"/>
  <ellipse cx="180" cy="70" rx="330" ry="220" fill="url(#h-glowA)"/>
  <ellipse cx="930" cy="330" rx="340" ry="230" fill="url(#h-glowB)"/>
  <ellipse cx="1120" cy="40" rx="260" ry="180" fill="url(#h-glowC)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="22" fill="none" stroke="#334155" stroke-opacity="0.45"/>

  <!-- ── left: the pitch ───────────────────────────────────────────── -->
  <text x="64" y="74" font-size="13" font-weight="600" letter-spacing="3.4" fill="#7C89A8">MACOS · WORD · EXCEL · LLM AGENT</text>

  <text x="62" y="152" font-size="66" font-weight="800" letter-spacing="-1.8" fill="url(#h-title)">OfficeBuddy</text>
  <rect x="66" y="170" width="230" height="3" rx="1.5" fill="url(#h-rule)"/>

  <text x="64" y="212" font-size="21" font-weight="500" fill="#C3CEE3">Edit your Word and Excel files by talking.</text>
  <text x="64" y="242" font-size="21" font-weight="500" fill="#C3CEE3">Verified by Word and Excel themselves.</text>

  <text x="64" y="298" font-size="31" font-weight="800" letter-spacing="-0.5" fill="#FCD34D">It doesn&#8217;t guess. It looks.</text>

  <!-- value pills -->
  <g font-size="12.5" font-weight="600">
    <rect x="64" y="322" width="196" height="30" rx="15" fill="#6366F1" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.55"/>
    <circle cx="82" cy="337" r="3.6" fill="#818CF8"/>
    <text x="94" y="341" fill="#C7D2FE">Real Office is the renderer</text>

    <rect x="270" y="322" width="188" height="30" rx="15" fill="#EC4899" fill-opacity="0.14" stroke="#F472B6" stroke-opacity="0.5"/>
    <circle cx="288" cy="337" r="3.6" fill="#F472B6"/>
    <text x="300" y="341" fill="#FBCFE8">Independent verifier</text>

    <rect x="468" y="322" width="200" height="30" rx="15" fill="#10B981" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.5"/>
    <circle cx="486" cy="337" r="3.6" fill="#34D399"/>
    <text x="498" y="341" fill="#A7F3D0">Your original is never touched</text>
  </g>

  <!-- ── right: render → look → verify ─────────────────────────────── -->
  <g transform="translate(742 78)">

    <!-- page 1 : before -->
    <g transform="translate(0 74) rotate(-7)" filter="url(#h-card)">
      <rect width="112" height="150" rx="9" fill="#F1F5F9"/>
      <rect x="16" y="20" width="52" height="6" rx="3" fill="#94A3B8"/>
      <rect x="16" y="40" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="52" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="64" width="58" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="84" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="96" width="44" height="4" rx="2" fill="#CBD5E1"/>
      <text x="56" y="140" font-size="9" font-weight="700" letter-spacing="1" fill="#94A3B8" text-anchor="middle">BEFORE</text>
    </g>

    <!-- page 2 : after -->
    <g transform="translate(124 62)" filter="url(#h-card)">
      <rect width="112" height="150" rx="9" fill="#FFFFFF"/>
      <rect x="26" y="18" width="60" height="9" rx="4" fill="#1E293B"/>
      <rect x="16" y="42" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="54" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="66" width="58" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="86" width="80" height="28" rx="2" fill="none" stroke="#475569" stroke-width="1.4"/>
      <line x1="16" y1="100" x2="96" y2="100" stroke="#475569" stroke-width="1.4"/>
      <line x1="43" y1="86" x2="43" y2="114" stroke="#475569" stroke-width="1.4"/>
      <line x1="70" y1="86" x2="70" y2="114" stroke="#475569" stroke-width="1.4"/>
      <text x="56" y="140" font-size="9" font-weight="700" letter-spacing="1" fill="#94A3B8" text-anchor="middle">AFTER</text>
    </g>

    <!-- page 3 : what the verifier sees -->
    <g transform="translate(252 74) rotate(7)" filter="url(#h-card)">
      <rect width="112" height="150" rx="9" fill="#FFFFFF"/>
      <rect x="26" y="18" width="60" height="9" rx="4" fill="#1E293B"/>
      <rect x="16" y="42" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="54" width="80" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="66" width="58" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="16" y="86" width="80" height="28" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="11" y="81" width="90" height="38" rx="3" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="2.4"/>
      <text x="56" y="140" font-size="9" font-weight="700" letter-spacing="1" fill="#EF4444" text-anchor="middle">DIFF</text>
    </g>

    <!-- the eye -->
    <g transform="translate(178 26)">
      <ellipse cx="0" cy="0" rx="82" ry="52" fill="#F59E0B" fill-opacity="0.30" filter="url(#h-soft)"/>
      <path d="M -46 0 Q 0 -34 46 0 Q 0 34 -46 0 Z" fill="#0A0F1E" stroke="url(#h-eye)" stroke-width="3.4" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="14" fill="url(#h-eye)"/>
      <circle cx="0" cy="0" r="6" fill="#0A0F1E"/>
      <circle cx="5.5" cy="-5.5" r="2.6" fill="#FFFBEB" fill-opacity="0.9"/>
    </g>

    <!-- verdict badge -->
    <g transform="translate(364 228)">
      <circle cx="0" cy="0" r="21" fill="#10B981"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#6EE7B7" stroke-opacity="0.6" stroke-width="1.5"/>
      <path d="M -8.5 0.5 L -2.5 6.5 L 9 -5.5" fill="none" stroke="#052E20" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
