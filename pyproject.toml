[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officebuddy"
version = "0.2.0"
description = "An agent that edits Word/Excel documents and verifies its own work with real rendered screenshots (macOS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["office", "docx", "xlsx", "agent", "llm", "automation", "macos"]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.24",
    "numpy>=1.24",
    "Pillow>=10.0",
    "typer>=0.16",  # 0.12 is incompatible with click>=8.2
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/richardChenzhihui/OfficeBuddy"
Repository = "https://github.com/richardChenzhihui/OfficeBuddy"
Issues = "https://github.com/richardChenzhihui/OfficeBuddy/issues"

[project.scripts]
officebuddy = "office_agent.cli:app"
office-agent = "office_agent.cli:app"  # legacy alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mac_office: drives real Microsoft Word/Excel and MAY TRIGGER macOS permission dialogs — run only when a user is present, never unattended",
    "live: requires MINIMAX_API_KEY and OFFICE_AGENT_LIVE_TEST=1",
]
